plugin:
  debug: true

ecosystem:
  enabled: true
  update-interval-ticks: 20

world-intelligence:
  enabled: true
  update-interval-millis: 5000

society:
  enabled: true
  observation-interval-millis: 10000
  villager-analysis-interval-millis: 10000
  social-interval-millis: 10000

  villager-citizen-behaviour:
    enabled: true
    update-interval-millis: 5000
    interaction-radius: 12.0
    hostile-radius: 10.0
    friendly-look-radius: 10.0
    hostile-threat-threshold: 0.65
    friendly-trust-threshold: 0.60
    action-cooldown-millis: 5000

  pillager-faction-intelligence:
    enabled: true
    update-interval-millis: 10000

behaviour:
  enabled: true
  processing-interval-millis: 1000

  decay:
    half-life-minutes: 30

adaptive-behaviour:
  enabled: true

  hostile-targeting:
    enabled: true
    range: 32.0
    minimum-advantage: 0.12
    cooldown-millis: 5000

ai:
  enabled: true
  provider: gemini
  model: gemini-3.6-flash
  api-key: ""
  minimum-confidence: 0.65
  strategy-interval-millis: 60000
  request-timeout-millis: 30000
  max-context-characters: 12000

database:
  enabled: false
